name: Build and Push Docker Image (ko)

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      KO_DOCKER_REPO: ghcr.io/icebear67/bubble
      REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install ko
        uses: ko-build/setup-ko@v0.9

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}

      - name: Build and push with short SHA tag
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          ko build --bare --platform=linux/amd64,linux/arm64 --tags "${SHORT_SHA}" --tags "latest" .